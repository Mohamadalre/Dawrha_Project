<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دخول — تطبيق المستخدم</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body class="user">
<div class="auth-wrap user">
  <div class="auth-card">
    <div class="logo"><span class="dot">د</span> دورها</div>
    <div class="auth-title">تسجيل الدخول</div>
    <div class="auth-sub">المواطنون · المؤسسات · المعامل · الجهات الحرة</div>

    <form id="loginForm">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input name="email" type="email" required placeholder="you@example.com" value="producer.flow@dawrha.com">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input name="password" type="password" required placeholder="••••••••" value="Producer@123">
      </div>
      <div class="field">
        <label>نوع الحساب</label>
        <select name="role">
          <option>مواطن (CITIZEN)</option>
          <option>مؤسسة (INSTITUTIONS)</option>
          <option>معمل (FACTORY)</option>
          <option>جهة حرة (EXTERNAL_PARTNER)</option>
        </select>
        <div class="hint">يُرسل `deviceId` تلقائيًا مع الطلب لتقييد الجلسة بجهاز واحد.</div>
      </div>
      <button class="btn primary block" type="submit">دخول</button>
    </form>

    <div class="row between mt-16">
      <a href="register.html" class="small" style="color:var(--user); font-weight:600">إنشاء حساب جديد</a>
      <a href="otp.html" class="small muted">نسيت كلمة المرور؟</a>
    </div>
    <div class="row mt-16" style="justify-content:center">
      <a class="chip" href="../driver/login.html">تطبيق السائق</a>
      <a class="chip" href="../admin/login.html">تطبيق الأدمن</a>
      <a class="chip" href="../index.html">الفهرس</a>
    </div>
  </div>
</div>
<script src="../assets/app.js"></script>
<script src="../assets/config.js"></script>
<script src="../assets/api.js"></script>
<script>
  /* الربط الحقيقي: POST /api/v1/auth/login/user-app */
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = this.querySelector('[type="submit"]');
    btn.disabled = true;
    API.login('login/user-app', { email: this.email.value, password: this.password.value }, {
      home: 'home.html',
      otp: 'otp.html',
      profile: null,
      waiting: null
    }).finally(function () { btn.disabled = false; });
  });
</script>
</body>
</html>
