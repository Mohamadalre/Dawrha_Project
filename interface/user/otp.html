<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحقق OTP — تطبيق المستخدم</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body class="user">
<div class="auth-wrap user">
  <div class="auth-card">
    <div class="logo"><span class="dot">د</span> دورها</div>
    <div class="auth-title">رمز التحقق</div>
    <div class="auth-sub">أدخل الرمز المكوَّن من 5 أرقام المرسل إلى بريدك الإلكتروني</div>

    <form id="otpForm">
      <div class="otp-row">
        <input maxlength="1" inputmode="numeric" required>
        <input maxlength="1" inputmode="numeric" required>
        <input maxlength="1" inputmode="numeric" required>
        <input maxlength="1" inputmode="numeric" required>
        <input maxlength="1" inputmode="numeric" required>
      </div>
      <button class="btn primary block mt-16" type="submit">تحقق وتفعيل الحساب</button>
    </form>
    <div class="row between mt-16">
      <a href="#" class="small muted" onclick="ui.ok('أُعيد إرسال الرمز (محاكاة)','POST /api/v1/auth/password/forgot/resend'); return false">إعادة إرسال الرمز</a>
      <span class="small muted">تنتهي صلاحية الرمز خلال 10 دقائق</span>
    </div>
  </div>
</div>
<script src="../assets/app.js"></script>
<script src="../assets/config.js"></script>
<script src="../assets/api.js"></script>
<script>
  /* autofocus chain */
  var inputs = document.querySelectorAll('.otp-row input');
  inputs.forEach(function (inp, i) {
    inp.addEventListener('input', function () {
      if (inp.value && inputs[i + 1]) inputs[i + 1].focus();
    });
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !inp.value && inputs[i - 1]) inputs[i - 1].focus();
    });
  });
  /* الربط الحقيقي: POST /api/v1/auth/otp/verify (Bearer = التوكن المؤقت) */
  document.getElementById('otpForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var code = '';
    inputs.forEach(function (i) { code += i.value; });
    if (code.length < 5) { ui.err('أدخل الرمز كاملًا (5 أرقام)'); return; }
    var btn = this.querySelector('[type="submit"]');
    btn.disabled = true;
    API.verifyOtp(code, { home: 'home.html', profile: '../driver/onboarding.html' }).finally(function () {
      btn.disabled = false;
    });
  });
  /* إعادة إرسال: PUT /api/v1/auth/otp/resend */
  document.querySelector('a[onclick*="ui.ok"]').onclick = function () { API.resendOtp(); return false; };
</script>
</body>
</html>
